name: macOS Build
on:
  push:
    branches: [main]
    paths: ['claude/**', 'codex/**', 'scripts/**', 'tests/**', '*.json', '.github/workflows/**']
  pull_request:
    paths: ['claude/**', 'codex/**', 'scripts/**', 'tests/**', '*.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [claude, codex]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Check
        run: python3 scripts/check.py
      - name: Build
        run: python3 scripts/build.py ${{ matrix.component }}
      - name: Verify universal binary
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          NAME=$(python3 -c 'import json,os; print(json.load(open("components.json"))[os.environ["COMPONENT"]]["name"])')
          lipo -verify_arch arm64 x86_64 "$COMPONENT/build/$NAME.app/Contents/MacOS/$NAME"
          codesign --verify --deep --strict "$COMPONENT/build/$NAME.app"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.component }}-${{ github.run_id }}
          path: ${{ matrix.component }}/build/*.app/Contents/Info.plist
          retention-days: 7
          if-no-files-found: warn
