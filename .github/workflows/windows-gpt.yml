# GPT 开机动画 Windows 版自动编译 + 自测：编译、离屏渲染字幕、对着记事本窗口播放并截图
name: windows-gpt-test
on:
  push:
    branches: [windows-gpt]
    paths: ['codex/windows/**', '.github/workflows/windows-gpt.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: 视频转 H.264
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:Path += ";C:\ProgramData\chocolatey\bin"
          ffmpeg -v error -y -i codex\assets\intro.mp4 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -c:a copy codex\windows\assets\intro.mp4
          ffmpeg -v error -y -i codex\assets\loop.mp4 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -an codex\windows\assets\loop.mp4
          Get-ChildItem codex\windows\assets
      - name: 媒体组件（服务器版 Windows 默认没装）
        continue-on-error: true
        run: |
          Install-WindowsFeature Server-Media-Foundation | Format-List
      - name: 编译
        run: powershell -ExecutionPolicy Bypass -File codex\windows\build.ps1 -Out "$pwd\build"
      - name: 离屏渲染字幕
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Start-Process build\GPTBootAnimation.exe -ArgumentList "--render-subtitle `"$pwd\codex\docs\preview.jpg`" `"$pwd\out\sub1.png`" 1" -Wait
          Start-Process build\GPTBootAnimation.exe -ArgumentList "--render-subtitle `"$pwd\codex\docs\preview.jpg`" `"$pwd\out\sub2.png`" 2" -Wait
          Get-ChildItem out
      - name: 对着记事本播放开屏（完整）
        run: |
          $np = Start-Process notepad -WindowStyle Maximized -PassThru
          Start-Sleep 3
          $app = Start-Process build\GPTBootAnimation.exe -PassThru -ArgumentList "--target-title Notepad --play intro --exit-after 27 --shot-at 1,5,9.5,11.6,13,18,21,26 --shot-dir `"$pwd\out\intro`""
          $app | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue; $app | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process $np -Force
      - name: 跳过开屏
        run: |
          $np = Start-Process notepad -WindowStyle Maximized -PassThru
          Start-Sleep 3
          $app = Start-Process build\GPTBootAnimation.exe -PassThru -ArgumentList "--target-title Notepad --play intro --test-skip 3 --exit-after 8 --shot-at 2.5,3.4,4.5,7 --shot-dir `"$pwd\out\skip`""
          $app | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue; $app | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process $np -Force
      - name: 只开循环背景
        run: |
          $np = Start-Process notepad -WindowStyle Maximized -PassThru
          Start-Sleep 3
          $app = Start-Process build\GPTBootAnimation.exe -PassThru -ArgumentList "--target-title Notepad --play loop --exit-after 14 --shot-at 2,6,12 --shot-dir `"$pwd\out\loop`""
          $app | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue; $app | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process $np -Force
      - name: 收集日志
        if: always()
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$env:LOCALAPPDATA\GPTBootAnimation\log.txt" out\ -ErrorAction SilentlyContinue
          Get-Content out\log.txt -ErrorAction SilentlyContinue
      - name: 截图压成小 JPG，推到 ci-results 分支
        if: always()
        run: |
          Add-Type -AssemblyName System.Drawing
          $codec = [Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $ep = New-Object Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object Drawing.Imaging.EncoderParameter ([Drawing.Imaging.Encoder]::Quality), 70L
          Get-ChildItem out -Recurse -Filter *.png | ForEach-Object {
            $img = [Drawing.Image]::FromFile($_.FullName)
            $w = [Math]::Min(960, $img.Width); $h = [int]($img.Height * $w / $img.Width)
            $bmp = New-Object Drawing.Bitmap $img, $w, $h
            $bmp.Save(($_.FullName -replace '\.png$', '.jpg'), $codec, $ep)
            $bmp.Dispose(); $img.Dispose(); Remove-Item $_.FullName
          }
          $dir = "ci-results/gpt-${{ github.run_number }}"
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          $ErrorActionPreference = "Continue"
          git fetch -q origin ci-results
          if ($LASTEXITCODE -eq 0) { git checkout -q -B ci-results origin/ci-results } else { git checkout -q --orphan ci-results; git rm -rq --cached . 2>$null }
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item out\* $dir -Recurse -Force
          git add $dir
          git commit -q -m "CI gpt-${{ github.run_number }}"
          git push -q origin ci-results
          Write-Host "results: $dir"
