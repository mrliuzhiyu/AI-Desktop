name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/check_docs.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'scripts/check_docs.py', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_docs.py
