name: Windows Build
on:
  push:
    branches: [main]
    paths: ['claude/**', 'codex/**', 'scripts/**', 'tests/**', '*.json', '.github/workflows/**']
  pull_request:
    paths: ['claude/**', 'codex/**', 'scripts/**', 'tests/**', '*.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [claude, codex]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:/ProgramData/chocolatey/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Check
        run: python scripts/check.py
      - name: Build
        run: python scripts/build.py ${{ matrix.component }}
      - name: Verify rendered subtitles
        run: ./scripts/smoke-windows.ps1 -Component ${{ matrix.component }}
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.component }}-${{ github.run_id }}
          path: artifacts/${{ matrix.component }}/
          retention-days: 7
          if-no-files-found: warn
